name: "SCP Command to Transfer Files"
description: "通过 SSH/SCP 将文件或目录上传到一个或多个远程服务器，支持密钥/密码认证、跳板机、多机并行。"
author: "PersiLiao"

branding:
  icon: "upload-cloud"
  color: "blue"

inputs:
  # ---------------------------------------------------------------- 连接
  host:
    description: "远程主机地址，多台机器用英文逗号分隔（如 foo.com,bar.com）。支持 host:port 写法。"
    required: true
  port:
    description: "远程 SSH 端口，默认 22。"
    required: false
    default: "22"
  username:
    description: "SSH 登录用户名。"
    required: true
  password:
    description: "SSH 密码认证（安全性低于密钥，建议优先使用 key）。"
    required: false
  key:
    description: "SSH 私钥内容（~/.ssh/id_ed25519 或 id_rsa 的全文），建议存放于 GitHub Secrets。"
    required: false
  key_path:
    description: "SSH 私钥文件路径，与 key 二选一。"
    required: false
  passphrase:
    description: "SSH 私钥的口令（passphrase），若私钥未加密则留空。"
    required: false
  fingerprint:
    description: "远程主机公钥的 SHA256 指纹，用于主机指纹校验，防止中间人攻击。留空则跳过校验（生产环境不推荐）。"
    required: false
  protocol:
    description: "IP 协议版本，可选值 tcp / tcp4 / tcp6，默认 tcp。"
    required: false
    default: "tcp"
  timeout:
    description: "建立 SSH 连接的超时时间，默认 30s。"
    required: false
    default: "30s"
  command_timeout:
    description: "单条远端命令的执行超时时间，默认 10m。"
    required: false
    default: "10m"
  use_insecure_cipher:
    description: "为兼容老旧服务端，启用额外的不安全加密算法。非必要不建议开启。"
    required: false
  cipher:
    description: "指定 SSH 加密算法（如 aes256-ctr），留空则由客户端协商。"
    required: false

  # ---------------------------------------------------------------- 传输
  source:
    description: "待上传的本地文件/目录，支持英文逗号或换行分隔，支持通配符（如 dist/*）。以 ! 开头的条目作为排除模式。"
    required: true
  target:
    description: "远程服务器上的目标目录（必须是目录路径），支持英文逗号分隔多个目标。"
    required: true
  rm:
    description: "上传前删除远端目标目录，请谨慎使用。"
    required: false
    default: "false"
  strip_components:
    description: "远端解包时剥离的 leading 路径层级数，默认 0（保留 source 中的原始路径）。"
    required: false
    default: "0"
  overwrite:
    description: "远端解包时追加 --overwrite，覆盖已存在的文件。"
    required: false
    default: "false"
  tar_dereference:
    description: "打包时追加 --dereference，跟随符号链接（Windows 服务器需要开启）。"
    required: false
    default: "false"
  tar_tmp_path:
    description: "远端存放临时 tar 包的目录，需以 / 结尾，默认 /tmp/。"
    required: false
    default: "/tmp/"
  tar_exec:
    description: "远端 tar 可执行文件的路径，默认 tar。"
    required: false
    default: "tar"
  debug:
    description: "输出调试信息（等价于 ssh -vvv）。"
    required: false
    default: "false"
  dry_run:
    description: "仅打印将要执行的动作，不实际连接与传输。"
    required: false
    default: "false"
  capture_stdout:
    description: "为 true 时，把远端命令的标准输出写入 action 的 stdout 输出。"
    required: false
    default: "false"

  # ---------------------------------------------------------------- 跳板机
  proxy_host:
    description: "跳板机（SSH Proxy / jump host）地址。"
    required: false
  proxy_port:
    description: "跳板机 SSH 端口，默认 22。"
    required: false
    default: "22"
  proxy_username:
    description: "跳板机登录用户名。"
    required: false
  proxy_password:
    description: "跳板机密码。"
    required: false
  proxy_key:
    description: "跳板机 SSH 私钥内容。"
    required: false
  proxy_key_path:
    description: "跳板机 SSH 私钥文件路径。"
    required: false
  proxy_passphrase:
    description: "跳板机私钥口令。"
    required: false
  proxy_fingerprint:
    description: "跳板机公钥的 SHA256 指纹，用于主机指纹校验。"
    required: false
  proxy_timeout:
    description: "跳板机连接超时时间，默认 30s。"
    required: false
    default: "30s"
  proxy_use_insecure_cipher:
    description: "为跳板机启用额外的不安全加密算法。"
    required: false
  proxy_cipher:
    description: "跳板机加密算法。"
    required: false

outputs:
  stdout:
    description: "capture_stdout 为 true 时，远端命令的标准输出内容。"
  duration:
    description: "本次传输耗时（秒）。"

runs:
  using: "docker"
  image: "Dockerfile"
