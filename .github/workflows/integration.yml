name: integration

# 在 runner 本机启动 sshd，对本 Action 做端到端验证。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SSH_PORT: "2222"

jobs:
  e2e:
    name: 端到端传输测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------- 环境
      - name: 启动本地 sshd
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server

          ssh-keygen -t ed25519 -N '' -C 'scp-action-ci' -f "${RUNNER_TEMP}/id_ed25519"
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          cat "${RUNNER_TEMP}/id_ed25519.pub" >> "${HOME}/.ssh/authorized_keys"
          chmod 600 "${HOME}/.ssh/authorized_keys"

          echo "${USER}:scp-ci-pass" | sudo chpasswd

          sudo mkdir -p /run/sshd
          sudo ssh-keygen -A
          sudo /usr/sbin/sshd \
            -o "Port ${SSH_PORT}" \
            -o 'PubkeyAuthentication yes' \
            -o 'PasswordAuthentication yes'
          sleep 1

      - name: 采集主机指纹与私钥
        id: ssh
        run: |
          set -euo pipefail
          ssh-keyscan -t ed25519 -p "${SSH_PORT}" 127.0.0.1 > "${RUNNER_TEMP}/known_hosts"
          fp="$(ssh-keygen -lf "${RUNNER_TEMP}/known_hosts" | awk '{print $2}')"
          {
            echo "fingerprint=${fp}"
            echo "username=${USER}"
            echo 'key<<SCP_EOF'
            cat "${RUNNER_TEMP}/id_ed25519"
            echo 'SCP_EOF'
          } >> "${GITHUB_OUTPUT}"
          echo "fingerprint=${fp}"

      - name: 获取 runner 内网 IP（供容器网络访问 sshd）
        id: net
        run: |
          set -euo pipefail
          ip="$(hostname -I | awk '{print $1}')"
          echo "value=${ip}" >> "${GITHUB_OUTPUT}"
          echo "runner ip=${ip}"

      - name: 构建镜像
        run: docker build -t scp-action:ci .

      # ------------------------------------------------------- 用例 1：uses 路径
      # 注意：Action 容器与 runner 不共享网络命名空间，因此用内网 IP 而非 127.0.0.1
      - name: 用例1 - 通过 action.yml 调用（密钥 + 指纹 + 保留原始路径）
        id: case1
        uses: ./
        with:
          host: ${{ steps.net.outputs.value }}
          port: ${{ env.SSH_PORT }}
          username: ${{ steps.ssh.outputs.username }}
          key: ${{ steps.ssh.outputs.key }}
          fingerprint: ${{ steps.ssh.outputs.fingerprint }}
          source: "tests/a.txt,tests/b.txt"
          target: "/tmp/out1"

      - name: 校验用例1
        run: |
          test -f /tmp/out1/tests/a.txt
          test -f /tmp/out1/tests/b.txt
          echo "outputs.duration=${{ steps.case1.outputs.duration }}"
          echo "用例1 通过"

      # ------------------------------------------------------- 用例 2：strip
      - name: 用例2 - strip_components=1
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/github/workspace" -w /github/workspace \
            -e INPUT_HOST=127.0.0.1 \
            -e "INPUT_PORT=${SSH_PORT}" \
            -e "INPUT_USERNAME=${{ steps.ssh.outputs.username }}" \
            -e "INPUT_KEY=${{ steps.ssh.outputs.key }}" \
            -e "INPUT_FINGERPRINT=${{ steps.ssh.outputs.fingerprint }}" \
            -e INPUT_SOURCE=tests/a.txt \
            -e INPUT_TARGET=/tmp/out2 \
            -e INPUT_STRIP_COMPONENTS=1 \
            scp-action:ci

      - name: 校验用例2
        run: |
          test -f /tmp/out2/a.txt
          test ! -e /tmp/out2/tests
          echo "用例2 通过"

      # ------------------------------------------------------- 用例 3：glob/排除
      - name: 用例3 - 通配符与排除
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/github/workspace" -w /github/workspace \
            -e INPUT_HOST=127.0.0.1 \
            -e "INPUT_PORT=${SSH_PORT}" \
            -e "INPUT_USERNAME=${{ steps.ssh.outputs.username }}" \
            -e "INPUT_KEY=${{ steps.ssh.outputs.key }}" \
            -e "INPUT_FINGERPRINT=${{ steps.ssh.outputs.fingerprint }}" \
            -e 'INPUT_SOURCE=tests/*,!tests/c.txt' \
            -e INPUT_TARGET=/tmp/out3 \
            scp-action:ci

      - name: 校验用例3
        run: |
          test -f /tmp/out3/tests/a.txt
          test -f /tmp/out3/tests/b.txt
          test ! -e /tmp/out3/tests/c.txt
          echo "用例3 通过"

      # ------------------------------------------------------- 用例 4：rm
      - name: 用例4 - 上传前清理目标目录
        run: |
          mkdir -p /tmp/out4 && touch /tmp/out4/stale.txt
          docker run --rm --network host \
            -v "${{ github.workspace }}:/github/workspace" -w /github/workspace \
            -e INPUT_HOST=127.0.0.1 \
            -e "INPUT_PORT=${SSH_PORT}" \
            -e "INPUT_USERNAME=${{ steps.ssh.outputs.username }}" \
            -e "INPUT_KEY=${{ steps.ssh.outputs.key }}" \
            -e "INPUT_FINGERPRINT=${{ steps.ssh.outputs.fingerprint }}" \
            -e INPUT_SOURCE=tests/a.txt \
            -e INPUT_TARGET=/tmp/out4 \
            -e INPUT_RM=true \
            scp-action:ci

      - name: 校验用例4
        run: |
          test ! -e /tmp/out4/stale.txt
          test -f /tmp/out4/tests/a.txt
          echo "用例4 通过"

      # ------------------------------------------------------- 用例 5：密码认证
      - name: 用例5 - 密码认证
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/github/workspace" -w /github/workspace \
            -e INPUT_HOST=127.0.0.1 \
            -e "INPUT_PORT=${SSH_PORT}" \
            -e "INPUT_USERNAME=${{ steps.ssh.outputs.username }}" \
            -e INPUT_PASSWORD=scp-ci-pass \
            -e INPUT_SOURCE=tests/c.txt \
            -e INPUT_TARGET=/tmp/out5 \
            scp-action:ci

      - name: 校验用例5
        run: |
          test -f /tmp/out5/tests/c.txt
          echo "用例5 通过"

      # ------------------------------------------------------- 用例 6：多机
      - name: 用例6 - 多台主机并行
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/github/workspace" -w /github/workspace \
            -e 'INPUT_HOST=127.0.0.1,127.0.0.1' \
            -e "INPUT_PORT=${SSH_PORT}" \
            -e "INPUT_USERNAME=${{ steps.ssh.outputs.username }}" \
            -e "INPUT_KEY=${{ steps.ssh.outputs.key }}" \
            -e "INPUT_FINGERPRINT=${{ steps.ssh.outputs.fingerprint }}" \
            -e INPUT_SOURCE=tests/a.txt \
            -e INPUT_TARGET=/tmp/out6 \
            scp-action:ci

      - name: 校验用例6
        run: |
          test -f /tmp/out6/tests/a.txt
          echo "用例6 通过"

      # ------------------------------------------------------- 用例 7：dry_run
      - name: 用例7 - dry_run 不产生任何文件
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/github/workspace" -w /github/workspace \
            -e INPUT_HOST=127.0.0.1 \
            -e "INPUT_PORT=${SSH_PORT}" \
            -e "INPUT_USERNAME=${{ steps.ssh.outputs.username }}" \
            -e "INPUT_KEY=${{ steps.ssh.outputs.key }}" \
            -e "INPUT_FINGERPRINT=${{ steps.ssh.outputs.fingerprint }}" \
            -e INPUT_SOURCE=tests/a.txt \
            -e INPUT_TARGET=/tmp/out7 \
            -e INPUT_DRY_RUN=true \
            scp-action:ci

      - name: 校验用例7
        run: |
          test ! -d /tmp/out7
          echo "用例7 通过"

      # ------------------------------------------------------- 用例 8：指纹校验
      - name: 用例8 - 指纹不匹配必须失败
        id: case8
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/github/workspace" -w /github/workspace \
            -e INPUT_HOST=127.0.0.1 \
            -e "INPUT_PORT=${SSH_PORT}" \
            -e "INPUT_USERNAME=${{ steps.ssh.outputs.username }}" \
            -e "INPUT_KEY=${{ steps.ssh.outputs.key }}" \
            -e INPUT_FINGERPRINT=SHA256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA \
            -e INPUT_SOURCE=tests/a.txt \
            -e INPUT_TARGET=/tmp/out8 \
            scp-action:ci

      - name: 校验用例8
        run: |
          if [ "${{ steps.case8.outcome }}" != "failure" ]; then
            echo "::error::指纹不匹配时应当失败，实际 outcome=${{ steps.case8.outcome }}"
            exit 1
          fi
          test ! -d /tmp/out8
          echo "用例8 通过"

      # ------------------------------------------------------- 清理
      - name: 汇总
        if: always()
        run: |
          echo "已执行 8 个端到端用例"
          find /tmp -maxdepth 1 -name 'out*' | sort
