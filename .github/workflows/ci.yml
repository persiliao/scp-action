name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/mnt" -w /mnt \
            koalaman/shellcheck:stable entrypoint.sh

      - name: actionlint
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" -w /repo \
            rhysd/actionlint:latest -color

      - name: 校验 action.yml
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml

          with open("action.yml", encoding="utf-8") as fh:
              doc = yaml.safe_load(fh)

          assert doc["runs"]["using"] == "docker", doc["runs"]
          assert doc["runs"]["image"] == "Dockerfile", doc["runs"]
          assert "host" in doc["inputs"] and "source" in doc["inputs"]
          print("action.yml OK -", len(doc["inputs"]), "inputs")
          PY

  build:
    name: 构建镜像并冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t scp-action:ci .

      - name: 冒烟：dry-run 全流程
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/github/workspace" \
            -w /github/workspace \
            -e INPUT_HOST=10.255.255.1 \
            -e INPUT_USERNAME=demo \
            -e INPUT_PASSWORD=demo \
            -e INPUT_SOURCE=tests/a.txt \
            -e INPUT_TARGET=/tmp/demo \
            -e INPUT_DRY_RUN=true \
            scp-action:ci

      - name: 冒烟：缺少认证信息应报错退出
        run: |
          set +e
          docker run --rm \
            -v "${{ github.workspace }}:/github/workspace" \
            -w /github/workspace \
            -e INPUT_HOST=10.255.255.1 \
            -e INPUT_USERNAME=demo \
            -e INPUT_SOURCE=tests/a.txt \
            -e INPUT_TARGET=/tmp/demo \
            scp-action:ci
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::缺少认证信息时应当失败"
            exit 1
          fi
          echo "按预期失败，退出码 $code"
