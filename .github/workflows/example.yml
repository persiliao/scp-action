name: example

# 手动触发的部署示例。
# 使用前请在仓库 Settings -> Secrets 中配置 HOST / USERNAME / SSH_PRIVATE_KEY。
on:
  workflow_dispatch:
    inputs:
      target:
        description: "远端目标目录"
        required: false
        default: "/opt/app"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建产物
        run: |
          mkdir -p dist
          echo "build at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/BUILD.txt

      - name: 上传到服务器
        id: scp
        uses: ./
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "dist"
          target: ${{ github.event.inputs.target }}
          strip_components: 1
          rm: false
          debug: false
          capture_stdout: true

      - name: 打印耗时
        run: echo "传输耗时 ${{ steps.scp.outputs.duration }} 秒"
